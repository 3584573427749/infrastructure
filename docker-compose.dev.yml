services:
  gateway-service:
    container_name: gateway-service
    build:
      context: ../gateway-service
    env_file:
      - ../gateway-service/.env
    volumes:
      - ../gateway-service:/var/www
    ports:
      - "18000:8080"
    depends_on:
      - auth-service
      - group-service
    networks:
      - internal

  auth-service:
    container_name: auth-service
    build:
      context: ../auth-service
    env_file:
      - ../auth-service/.env
    volumes:
      - ../auth-service:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:8080"
    networks:
      - internal

  group-service:
    container_name: group-service
    build:
      context: ../group-service
    env_file:
      - ../group-service/.env
    volumes:
      - ../group-service:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18081:8080"
    networks:
      - internal

  admin-ui:
    container_name: admin-ui
    build:
      context: ../admin-ui
      dockerfile: Dockerfile.dev
    volumes:
      - ../admin-ui:/app
      - /app/node_modules
    ports:
      - "15173:5173"
    networks:
      - internal

networks:
  internal:
    driver: bridge